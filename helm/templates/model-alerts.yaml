apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-model-alerts
  labels:
    grafana_alert: "1"
data:
  model-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: {{ .Release.Name }}-model-cpu
        folder: AI Chat
        interval: 1m
        rules:
          - uid: {{ .Release.Name }}-model-high-cpu
            title: AI Chat model high CPU
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  editorMode: code
                  expr: |
                    avg(
                      sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}",pod=~"{{ .Release.Name }}-model-.+",container="{{ .Release.Name }}-model"}[5m]))
                      /
                      sum by (pod) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}",pod=~"{{ .Release.Name }}-model-.+",container="{{ .Release.Name }}-model",resource="cpu"})
                    )
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  editorMode: code
                  expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="{{ .Release.Name }}-model"}
                  instant: true
                  refId: B
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  refId: C
                  type: threshold
                  conditions:
                    - evaluator:
                        params: [0.75]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        type: last
                      type: query
            noDataState: NoData
            execErrState: Error
            for: 1m
            annotations:
              summary: Model pods are using more than 75% of their CPU request
              description: "CPU usage is {{`{{ $values.A.Value | humanizePercentage }}`}}. Running pods: {{`{{ $values.B.Value }}`}}."
            labels:
              severity: warning
            isPaused: false
      - orgId: 1
        name: {{ .Release.Name }}-model-memory
        folder: AI Chat
        interval: 1m
        rules:
          - uid: {{ .Release.Name }}-model-high-memory
            title: AI Chat model high memory
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  editorMode: code
                  expr: |
                    avg(
                      sum by (pod) (container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}",pod=~"{{ .Release.Name }}-model-.+",container="{{ .Release.Name }}-model"})
                      /
                      sum by (pod) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}",pod=~"{{ .Release.Name }}-model-.+",container="{{ .Release.Name }}-model",resource="memory"})
                    )
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  editorMode: code
                  expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="{{ .Release.Name }}-model"}
                  instant: true
                  refId: B
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  refId: C
                  type: threshold
                  conditions:
                    - evaluator:
                        params: [0.5]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        type: last
                      type: query
            noDataState: NoData
            execErrState: Error
            for: 1m
            annotations:
              summary: Model pods are using more than 50% of their memory request
              description: "Memory usage is {{`{{ $values.A.Value | humanizePercentage }}`}}. Running pods: {{`{{ $values.B.Value }}`}}."
            labels:
              severity: warning
            isPaused: false
