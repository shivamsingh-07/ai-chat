apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-db
  serviceName: {{ .Release.Name }}-db-svc
  replicas: {{ .Values.database.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-db
    spec:
      containers:
        - name: {{ .Release.Name }}-db
          image: {{ .Values.database.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: MONGO_PASSWORD
          resources:
            requests:
              memory: 256Mi
              cpu: 150m
            limits:
              memory: 512Mi
              cpu: 300m
          ports:
            - containerPort: {{ .Values.database.port }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.database.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  mongosh
                  -u "$MONGO_INITDB_ROOT_USERNAME"
                  -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --quiet
                  --eval "db.adminCommand('ping')"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: {{ .Release.Name }}-data-pvc
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: {{ .Release.Name }}-data-pvc
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db-svc
spec:
  selector:
    app: {{ .Release.Name }}-db
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
      protocol: TCP
