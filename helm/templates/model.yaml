apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-model
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-model
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-model
    spec:
      containers:
        - name: {{ .Release.Name }}-model
          image: {{ .Values.ollama.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: OLLAMA_MODEL
          command:
            - /bin/sh
            - -c
            - |
              ollama serve &
              until ollama list > /dev/null 2>&1; do sleep 1; done
              ollama pull "$OLLAMA_MODEL"
              wait
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1000m
          ports:
            - containerPort: {{ .Values.ollama.port }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ollama list | grep -F "$OLLAMA_MODEL"
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: {{ .Values.ollama.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-model-svc
spec:
  selector:
    app: {{ .Release.Name }}-model
  ports:
    - port: {{ .Values.ollama.port }}
      targetPort: {{ .Values.ollama.port }}
      protocol: TCP
