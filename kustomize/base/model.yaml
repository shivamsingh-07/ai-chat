apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chat-model
spec:
  selector:
    matchLabels:
      app: ai-chat-model
  template:
    metadata:
      labels:
        app: ai-chat-model
    spec:
      containers:
        - name: ai-chat-model
          image: ollama/ollama
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              ollama serve &
              until ollama list > /dev/null 2>&1; do sleep 1; done
              ollama pull smollm2:135m
              wait
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1000m
          ports:
            - containerPort: 11434
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama list | grep -F 'smollm2:135m'"]
            initialDelaySeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ai-chat-model-svc
spec:
  selector:
    app: ai-chat-model
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
