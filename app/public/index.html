<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <title>AI Chat Bot</title>
        <link rel="icon" href="/ollama.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/styles.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
    </head>
    <body>
        <a class="skip-link" href="#input">Skip to message input</a>
        <div class="app-layout">
            <aside class="sidebar">
                <div class="sidebar__brand">
                    <a
                        class="sidebar__logo-link"
                        href="https://ollama.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Ollama — open models (opens in new tab)"
                    >
                        <img class="sidebar__logo" src="/ollama.svg" width="32" height="32" alt="" decoding="async" />
                    </a>
                    <div class="sidebar__titles">
                        <h1 class="sidebar__title">AI Chat Bot</h1>
                        <p class="sidebar__subtitle-brand">Powered by Ollama</p>
                    </div>
                </div>
                <button
                    class="btn btn--ghost btn--with-icon sidebar__new-btn"
                    type="button"
                    id="newSessionBtn"
                    aria-label="Start a new conversation"
                >
                    <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    New chat
                </button>
                <div class="sidebar__sessions">
                    <h2 class="sidebar__subtitle">Recent chats</h2>
                    <ul id="recentSessions" class="session-list">
                        <!-- Populated via JS -->
                    </ul>
                </div>
            </aside>
            <main class="app-main">
                <div class="chat-shell">
                    <div class="chat-scroll" id="chatScroll">
                        <div id="banner" class="banner banner--chat" role="alert" aria-live="assertive" hidden>
                            <p class="banner__text" id="bannerText"></p>
                            <button class="btn btn--small" type="button" id="retryBtn">Retry</button>
                        </div>
                        <section
                            id="thread"
                            class="thread"
                            aria-label="Conversation"
                            role="log"
                            aria-relevant="additions"
                            aria-live="polite"
                            aria-busy="false"
                        ></section>

                        <div id="typingRow" class="typing-wrap" role="status" aria-live="polite" aria-hidden="true" hidden>
                            <span class="visually-hidden">Assistant is typing</span>
                            <div class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                        </div>
                        <div id="chatScrollAnchor" class="chat-scroll-anchor" aria-hidden="true"></div>
                    </div>
                </div>
                <div class="composer-shell" id="composerShell">
                    <form class="composer" id="composer" autocomplete="off" aria-label="Send a message">
                        <label class="visually-hidden" for="input">Message</label>
                        <span class="composer__prefix-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M7 8.5H12M7 12H15M9.68375 18H16.2C17.8802 18 18.7202 18 19.362 17.673C19.9265 17.3854 20.3854 16.9265 20.673 16.362C21 15.7202 21 14.8802 21 13.2V7.8C21 6.11984 21 5.27976 20.673 4.63803C20.3854 4.07354 19.9265 3.6146 19.362 3.32698C18.7202 3 17.8802 3 16.2 3H7.8C6.11984 3 5.27976 3 4.63803 3.32698C4.07354 3.6146 3.6146 4.07354 3.32698 4.63803C3 5.27976 3 6.11984 3 7.8V20.3355C3 20.8684 3 21.1348 3.10923 21.2716C3.20422 21.3906 3.34827 21.4599 3.50054 21.4597C3.67563 21.4595 3.88367 21.2931 4.29976 20.9602L6.68521 19.0518C7.17252 18.662 7.41617 18.4671 7.68749 18.3285C7.9282 18.2055 8.18443 18.1156 8.44921 18.0613C8.74767 18 9.0597 18 9.68375 18Z"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </span>
                        <div class="composer__input-shell">
                            <div class="composer__field">
                                <textarea
                                    id="input"
                                    name="message"
                                    rows="1"
                                    placeholder="Ask anything..."
                                    maxlength="100000"
                                    aria-describedby="composer-hint"
                                ></textarea>
                                <span id="composer-hint" class="visually-hidden">
                                    Press Enter to send. Shift plus Enter for a new line.
                                </span>
                            </div>
                        </div>
                        <button class="composer__send" id="sendBtn" type="submit">
                            <svg
                                class="composer__send-icon"
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                aria-hidden="true"
                            >
                                <path
                                    d="M22 2 11 13"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                                <path
                                    d="M22 2l-7 20-4-9-9-4 18-7Z"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                            <span class="composer__send-text">Send</span>
                        </button>
                    </form>
                </div>
            </main>
        </div>
        <script src="/app.js" defer></script>
    </body>
</html>
