apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
spec:
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
    spec:
      containers:
        - name: chat-api
          image: abstergo07/ai-chat
          envFrom:
            - configMapRef:
                name: chat-app-config
            - secretRef:
                name: chat-app-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: chat-api-svc
spec:
  type: LoadBalancer
  selector:
    app: chat-api
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
